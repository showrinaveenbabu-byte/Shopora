<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SHOPORA</title>
  <meta name="description" content="Create your SHOPORA account for verified authentic shopping and fast fulfillment." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .auth-wrap {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Flagship SHOPORA Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">
          <div class="brand-icon-box" style="width: 32px; height: 32px; font-size: 1rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </div>
          <span>SHOP<span style="color: var(--primary);">ORA</span></span>
        </div>
        <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main);">Create your account</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 4px;">
          Join millions of shoppers discovering daily verified deals
        </p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Your Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="First and last name" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-phone">Contact Phone</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password (6+ chars) *</label>
            <div style="position: relative;">
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required />
              <button type="button" id="toggle-reg-pwd-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); font-size: 0.9rem;" aria-label="Toggle Password">
                👁️
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password *</label>
            <div style="position: relative;">
              <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" minlength="6" required />
              <button type="button" id="toggle-reg-confirm-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); font-size: 0.9rem;" aria-label="Toggle Confirm Password">
                👁️
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-reg-btn" style="width: 100%; margin-top: 8px; padding: 12px;">
          Create Account &rarr;
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
        Already have a SHOPORA account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Global Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.renderNavbar('register');
      Components.renderFooter();

      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const phoneInput = document.getElementById('reg-phone');
      const pwdInput = document.getElementById('reg-password');
      const confirmInput = document.getElementById('reg-confirm');
      const submitBtn = document.getElementById('submit-reg-btn');
      const togglePwdBtn = document.getElementById('toggle-reg-pwd-btn');
      const toggleConfirmBtn = document.getElementById('toggle-reg-confirm-btn');

      if (togglePwdBtn && pwdInput) {
        togglePwdBtn.onclick = () => {
          pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        };
      }
      if (toggleConfirmBtn && confirmInput) {
        toggleConfirmBtn.onclick = () => {
          confirmInput.type = confirmInput.type === 'password' ? 'text' : 'password';
        };
      }

      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();

          const name = nameInput.value.trim();
          const email = emailInput.value.trim();
          const phone = phoneInput.value.trim();
          const password = pwdInput.value;
          const confirm = confirmInput.value;

          if (password !== confirm) {
            Components.showToast('Passwords do not match.', 'error');
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';

          try {
            const res = await API.post('/auth/register', { name, email, phone, password });
            const token = res.token || (res.data && res.data.token);
            const user = res.user || res.data;

            if (res.success && token && user) {
              Auth.setSession(token, user);
              Components.showToast(`Account created! Welcome to SHOPORA, ${name.split(' ')[0]}!`, 'success');
              setTimeout(() => {
                window.location.href = '../index.html';
              }, 450);
            } else {
              throw new Error(res.message || 'Registration failed');
            }
          } catch (err) {
            console.error('Registration error:', err);
            Components.showToast(err.message || 'Error creating account. Please try again.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account →';
          }
        };
      }
    });
  </script>
</body>
</html>
