<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SHOPORA</title>
  <meta name="description" content="Sign in to your SHOPORA customer or merchant account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .auth-wrap {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      box-shadow: var(--shadow-sm);
    }
    .demo-accounts-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--primary-soft);
      border: 1.5px dashed var(--primary-border);
    }
  </style>
</head>
<body>

  <!-- Flagship SHOPORA Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="display: inline-flex; align-items: center; gap: 8px; font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">
          <div class="brand-icon-box" style="width: 32px; height: 32px; font-size: 1rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          </div>
          <span>SHOP<span style="color: var(--primary);">ORA</span></span>
        </div>
        <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main);">Sign in to your account</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 4px;">
          Access your orders, wishlist, and recommendations
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email or Phone</label>
          <input type="text" id="login-email" class="form-control" placeholder="user@shopora.com or phone" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
            <button type="button" id="toggle-pwd-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); font-size: 0.95rem;">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-login-btn" style="width: 100%; margin-top: 8px; padding: 12px;">
          Sign In &rarr;
        </button>
      </form>

      <!-- Demo Accounts Quick Fill -->
      <div class="demo-accounts-box">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;">
          ⚡ Instant Demo Logins
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm" id="fill-customer-btn" style="flex: 1; font-size: 0.8rem; padding: 8px;">
            👤 Customer Demo
          </button>
          <button type="button" class="btn btn-outline btn-sm" id="fill-admin-btn" style="flex: 1; font-size: 0.8rem; padding: 8px;">
            🛡️ Admin Demo
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--text-muted);">
        New to SHOPORA? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create an account</a>
      </div>
    </div>
  </main>

  <!-- Global Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.renderNavbar('login');
      Components.renderFooter();

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const pwdInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('submit-login-btn');
      const togglePwdBtn = document.getElementById('toggle-pwd-btn');
      const fillCustomerBtn = document.getElementById('fill-customer-btn');
      const fillAdminBtn = document.getElementById('fill-admin-btn');

      if (togglePwdBtn && pwdInput) {
        togglePwdBtn.onclick = () => {
          pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        };
      }

      if (fillCustomerBtn) {
        fillCustomerBtn.onclick = () => {
          emailInput.value = 'user@shopora.com';
          pwdInput.value = 'User@12345';
          Components.showToast('Customer credentials autofilled!', 'info');
        };
      }

      if (fillAdminBtn) {
        fillAdminBtn.onclick = () => {
          emailInput.value = 'admin@shopora.com';
          pwdInput.value = 'Admin@12345';
          Components.showToast('Administrator credentials autofilled!', 'info');
        };
      }

      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';

          try {
            const email = emailInput.value.trim();
            const password = pwdInput.value;

            const res = await API.post('/auth/login', { email, password });
            const token = res.token || (res.data && res.data.token);
            const user = res.user || res.data;

            if (res.success && token && user) {
              Auth.setSession(token, user);
              const displayName = user.name ? user.name.split(' ')[0] : 'Customer';
              Components.showToast(`Welcome back, ${displayName}!`, 'success');

              const redirect = Utils.getUrlParam('redirect') || (user.role === 'admin' ? 'admin.html' : '../index.html');
              setTimeout(() => {
                window.location.href = redirect;
              }, 450);
            } else {
              throw new Error(res.message || 'Invalid credentials');
            }
          } catch (err) {
            console.error('Login error:', err);
            Components.showToast(err.message || 'Invalid email or password.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In →';
          }
        };
      }
    });
  </script>
</body>
</html>
